<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <main id="playing-cards">
        <div class="card">
            <div class="left">
                <div>A</div>
                <div>♠</div>
            </div>
            <div class="middle">
                <div>♠</div>
            </div>
            <div class="right">
                <div class="flipped">A</div>
                 <div class="flipped">♠</div>
            </div>
        </div>
        <!-- four more cards  -->
           <div class="card">
            <div class="left">
                <div>2</div>
                <div>♣</div>
            </div>
            <div class="middle">
                <div>♣</div>
                <div class="flipped">♣</div>
            </div>
            <div class="right">
                <div class="flipped">2</div>
                 <div class="flipped">♣</div>
            </div>
        </div>
        <!-- three more -->
           <div class="card red">
            <div class="left">
                <div>3</div>
                <div>♥</div>
            </div>
            <div class="middle">
                <div>♥</div>
                <div>♥</div>
                <div class="flipped">♥</div>
            </div>
            <div class="right">
                <div class="flipped">3</div>
                 <div class="flipped">♥</div>
            </div>
        </div>
        <!-- two more -->
           <div class="card">
            <div class="left">
                <div>4</div>
                <div>♣</div>
            </div>
            <div class="middle">
                <div>♣♣</div>
                <div class="flipped">♣♣</div>
            </div>
            <div class="right">
                <div class="flipped">4</div>
                 <div class="flipped">♣</div>
            </div>
        </div>
        <!-- One more -->
           <div class="card red">
            <div class="left">
                <div>5</div>
                <div>♦</div>
            </div>
            <div class="middle">
                <div>♦♦</div>
                <div>♦</div>
                <div>♦♦</div>
            </div>
            <div class="right">
                <div class="flipped">5</div>
                 <div class="flipped">♦</div>
            </div>
        </div>
    </main>
</body>
</html>
